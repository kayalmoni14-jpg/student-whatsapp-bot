<!DOCTYPE html>
<html>
<head>
    <title>Add Exam Marks</title>
</head>
<body>

<h2>Add Exam Marks</h2>

<h3>{{ student.name }} ({{ student.reg_no }})</h3>

<form method="POST">

    <label>Exam Name</label><br>
    <input type="text" name="exam_name" required><br><br>

    <label>Subject</label><br>
    <input type="text" name="subject" required><br><br>

    <label>Mark</label><br>
    <input type="number" name="mark" required><br><br>

    <button type="submit">
        Save Marks
    </button>

</form>

</body>
</html>
